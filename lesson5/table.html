<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelat</title>
    <style>
        table,td,th{
            border:1px solid;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>first name</th>
                <th>last name</th>
                <th>age</th>
                <th>gmail</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>aris</td>
                <td>arifi</td>
                <td>14</td>
                <td>arisarifi@gmail.com</td>
            </tr>
            <tr>
                <td>cristiano</td>
                <td>ronaldo</td>
                <td>41</td>
                <td>ronaldo@gmail.com</td>
            </tr>
        </tbody>
        <tfoot>
                <tr>
                    <td colspan="4">table footer</td>
                </tr>
        </tfoot>
    </table>
    <br>
    <hr>
    <table>
        <tr>
            <th>name:</th>
            <td>jon doe</td>
            <td>richard doe</td>
        </tr>
        <tr>
            <th rowspan="2">email:</th>
            <td>jon@gmail.com</td>
            <td rowspan="2">richard@gmail.com</td>
        </tr>
        <tr>
            <td>jon2@gmail.com</td>
        </tr>
    </table>
</body>
</html>
