<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms HTML</title>
</head>
<body>
    <form >
        <label for="firstname">first name</label>
        <input type="text" id="firstname" name="firstname"><br>

        <label for="lastname">last name</label>
        <input type="text" id="lastname" name="lastname"><br>

        <label for="email">email</label>
        <input type="email" id="email" name="email">

        <label for="password">password</label>
        <input type="password" id="password" name="password"><br><br>

        <label >gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">female</label><br><br>

        <label >hobbise:</label><br>
        <input type="checkbox" id="footbal" name="gaming" value="footbal">
        <label for="hobbise">footbal</label><br>
        <input type="checkbox" id="swimming" name="swimming" value="swimming">
        <label for="swimming">swimming</label><br>


        <input type="submit" id="submit" value="submit"><br>



    </form>
</body>
</html>
